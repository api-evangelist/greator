aid: greator
name: Greator
description: >-
  Greator (formerly GEDANKENtanken, founded 2012) is Germany's largest personal-
  development platform, headquartered in Cologne and serving roughly 234,000
  customers. It runs a B2C ecosystem of free content (masterclasses, podcasts, a
  YouTube channel, magazine articles and personality tests) alongside paid,
  certified training programs such as The School of Life, Momentum Mastery, the
  Finance Academy and TheKey speaking training. Greator also produces live
  events including the annual Greator Festival (15,000+ attendees, 400+ speakers)
  and operates Greator Business, a B2B corporate offering. The company was
  surfaced as a portfolio company of HV Capital and added to the API Evangelist
  network. Greator publishes no public developer API, developer portal, or
  /.well-known discovery surface; this profile captures its identity, web
  properties, and domain-security posture.
